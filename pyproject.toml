[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teamdocs-ai"
version = "0.1.0"
description = "AI-powered engineering documentation and repository assistant"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "markdown",
    "pymupdf>=1.24",
    "unstructured>=0.15",
    "unstructured-inference>=0.7",
    "python-docx>=1.1",
    "docx2txt>=0.8",
    "pytesseract",
    "pillow",
    "pdf2image",
    "langchain>=0.3",
    "langchain-openrouter",
    "langchain-experimental>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-chroma>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "tqdm",
    "requests>=2.31",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "streamlit>=1.38",
    "langchain-core",
    "pdfminer-six",
    "beautifulsoup4",
    "langchain-google-genai",
]

[tool.setuptools.packages.find]
where = ["src"]
